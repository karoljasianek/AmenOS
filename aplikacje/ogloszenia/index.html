<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ogłoszenia parafialne</title>
<link rel="stylesheet" href="../wspolne/amenos.css">
<script src="../wspolne/dane.js"></script>
<script src="../wspolne/liturgia.js"></script>
<script src="../wspolne/amenos.js"></script>
<script src="../wspolne/dzwiek.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; }
  .korek { flex: 1; overflow-y: auto; padding: 28px 30px; border: 12px solid #7B4A22; border-bottom: 0;
           background-color: #C69A62;
           background-image: radial-gradient(#B08550 1px, transparent 1.5px), radial-gradient(#D9B07A 1px, transparent 1.5px);
           background-size: 11px 13px, 17px 9px; background-position: 0 0, 5px 4px;
           box-shadow: inset 0 0 40px rgba(60, 30, 10, .35); }
  .tytul { margin: 0 auto 26px; width: fit-content; background: #FFFDF7; padding: 12px 40px; border-radius: 3px; text-align: center;
           box-shadow: 0 4px 10px rgba(0, 0, 0, .25); position: relative; }
  .tytul h1 { color: #B42A32; letter-spacing: .06em; font-size: 22px; }
  .tytul::before, .tytul::after { content: ""; position: absolute; top: 8px; width: 11px; height: 11px; border-radius: 50%; background: #2F62D9; }
  .tytul::before { left: 10px; } .tytul::after { right: 10px; }
  .karteczki { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px 20px; }
  .kart { position: relative; padding: 30px 16px 16px; min-height: 150px; border-radius: 3px; box-shadow: 0 6px 12px rgba(0, 0, 0, .28);
          font-size: 14.5px; line-height: 1.45; color: #2E2A22; animation: przypnij .3s ease-out; user-select: text; }
  .kart:nth-child(4n+1) { background: #FFF3A6; transform: rotate(-1.2deg); } .kart:nth-child(4n+2) { background: #FFD6E5; transform: rotate(.8deg); }
  .kart:nth-child(4n+3) { background: #D2ECFF; transform: rotate(-.5deg); } .kart:nth-child(4n) { background: #D8F5CB; transform: rotate(1.3deg); }
  .kart::before { content: ""; position: absolute; left: 50%; top: 8px; width: 15px; height: 15px; margin-left: -7px; border-radius: 50%;
                  background: radial-gradient(circle at 35% 35%, #FFB8BE, #D6333F 55%); box-shadow: 0 2px 3px rgba(0, 0, 0, .35); }
  .kart .nr { font-weight: 700; color: #8A6A20; margin-right: 4px; }
  .kart .usun { position: absolute; right: 6px; top: 4px; border: 0; background: none; font-size: 20px; color: #8A8070; cursor: pointer; opacity: 0; }
  .kart:hover .usun { opacity: 1; }
  @keyframes przypnij { from { transform: translateY(-20px) scale(1.05); opacity: 0; } }
  .pusto { margin: 40px auto; width: 300px; background: #FFF3A6; padding: 34px 20px; text-align: center; font-weight: 600; box-shadow: 0 6px 12px rgba(0,0,0,.28); }
  footer { display: flex; gap: 10px; padding: 12px 16px; background: #F3F4F7; border-top: 1px solid var(--linia); }
  /* wydruk na tablicę w kościele */
  .wydruk { display: none; }
  @media print {
    .korek, footer { display: none; }
    .wydruk { display: block; padding: 10mm 14mm; font-family: "DejaVu Serif", serif; color: #000; }
    .wydruk h1 { text-align: center; font-size: 22pt; } .wydruk h2 { text-align: center; font-weight: 400; font-size: 13pt; margin: 4pt 0 18pt; }
    .wydruk ol li { margin: 0 0 10pt; font-size: 13pt; line-height: 1.45; }
  }
</style>
</head>
<body>
<div class="korek">
  <div class="tytul"><h1>OGŁOSZENIA PARAFIALNE</h1><div class="szary maly" id="parafia"></div></div>
  <div class="karteczki" id="karteczki"></div>
</div>
<footer class="nie-drukuj">
  <input class="pole" id="wej" maxlength="300" placeholder="Napisz nowe ogłoszenie i naciśnij Enter…" autocomplete="off">
  <button class="przycisk glowny" id="przypnij">Przypnij</button>
  <button class="przycisk" id="drukuj" title="Wydrukuj ogłoszenia na tablicę w kościele">Drukuj</button>
</footer>
<div class="wydruk" id="wydruk"></div>
<script>
"use strict";
Amen.ustawAkcent();
const MAX = 16;
let ogl = Amen.ogloszenia();

function rysuj() {
  document.getElementById("parafia").textContent = Amen.parafia();
  const k = document.getElementById("karteczki");
  k.innerHTML = ogl.length ? ogl.map((o, i) => `<div class="kart"><button class="usun" data-i="${i}" title="Zdejmij">×</button><span class="nr">${i + 1}.</span>${Amen.esc(o)}</div>`).join("")
                           : `<div class="pusto">Brak ogłoszeń. Proboszcz ma dzień wolny.</div>`;
  k.querySelectorAll(".usun").forEach(b => b.onclick = () => { ogl.splice(+b.dataset.i, 1); Amen.zapisz("ogloszenia", ogl); rysuj(); });
  const t = Amen.teraz(), D = LIT.dniOdEpoki(t.r, t.m, t.d), nd = D + (7 - LIT.dzienTygodnia(D)) % 7, x = LIT.dataZDni(nd);
  document.getElementById("wydruk").innerHTML = `<h1>Ogłoszenia parafialne</h1><h2>${Amen.esc(Amen.parafia())}<br>${Amen.esc(LIT.liturgia(x.r, x.m, x.d).nazwa)} - ${x.d} ${LIT.MIES_DOP[x.m]} ${x.r}</h2>
    <ol>${ogl.map(o => `<li>${Amen.esc(o)}</li>`).join("")}</ol>`;
}
function przypnij() {
  const w = document.getElementById("wej"), t = w.value.trim();
  if (!t) { Amen.komunikat("Najpierw napisz treść ogłoszenia w polu na dole."); return; }
  if (ogl.length >= MAX) { Amen.komunikat("Tablica pełna! Zdejmij któreś ogłoszenie, zanim kościelny przybije nowe gwoździem."); return; }
  ogl.push(t); w.value = "";
  Amen.zapisz("ogloszenia", ogl);
  Dzwiek.efekt("klik");
  rysuj();
  document.querySelector(".korek").scrollTop = 1e6;
}
document.getElementById("przypnij").onclick = przypnij;
document.getElementById("wej").onkeydown = e => { if (e.key === "Enter") przypnij(); };
document.getElementById("drukuj").onclick = () => window.print();
Amen.naZmiane("ogloszenia", o => { ogl = o; rysuj(); });
rysuj();
document.getElementById("wej").focus();
</script>
</body>
</html>
