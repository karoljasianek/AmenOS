# AmenOS @WERSJA@ - menu płyty (BIOS i UEFI)
set timeout=10
set default=0
if loadfont /boot/grub/fonts/unicode.pf2 ; then
  set gfxmode=auto
  insmod all_video
  insmod gfxterm
  insmod png
  terminal_output gfxterm
  if background_image /boot/grub/tlo.png ; then
    set color_normal=white/black
    set color_highlight=black/light-gray
  fi
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Uruchom AmenOS @WERSJA@" {
  set gfxpayload=keep
  linux  /casper/vmlinuz boot=casper quiet splash locale=pl_PL.UTF-8 keyboard-configuration/layoutcode=pl console-setup/layoutcode=pl timezone=Europe/Warsaw ---
  initrd /casper/initrd
}
menuentry "Uruchom AmenOS (bezpieczny tryb grafiki)" {
  linux  /casper/vmlinuz boot=casper nomodeset quiet splash locale=pl_PL.UTF-8 keyboard-configuration/layoutcode=pl console-setup/layoutcode=pl timezone=Europe/Warsaw ---
  initrd /casper/initrd
}
menuentry "Uruchom AmenOS z tekstowymi komunikatami (diagnostyka)" {
  linux  /casper/vmlinuz boot=casper locale=pl_PL.UTF-8 keyboard-configuration/layoutcode=pl ---
  initrd /casper/initrd
}
menuentry "Sprawdź płytę pod kątem błędów" {
  linux  /casper/vmlinuz boot=casper integrity-check quiet splash locale=pl_PL.UTF-8 ---
  initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
  menuentry "Ustawienia UEFI komputera" { fwsetup }
fi
menuentry "Uruchom ponownie" { reboot }
menuentry "Wyłącz komputer" { halt }
