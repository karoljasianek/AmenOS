set timeout=3
set default=0
insmod all_video
terminal_output console

menuentry "AmenOS - pulpit graficzny" {
    set gfxpayload=1920x1080x32,1920x1080x24,1680x1050x32,1600x900x32,1440x900x32,1366x768x32,1280x1024x32,1280x800x32,1280x720x32,1024x768x32,1024x768x24,800x600x32,auto
    multiboot /boot/amenos.bin
    boot
}

menuentry "AmenOS - tryb tekstowy (dla starszych kart graficznych)" {
    set gfxpayload=text
    multiboot /boot/amenos-tekst.bin
    boot
}

menuentry "AmenOS - bez karty dźwiękowej (tylko głośniczek PC)" {
    set gfxpayload=1920x1080x32,1920x1080x24,1680x1050x32,1600x900x32,1440x900x32,1366x768x32,1280x1024x32,1280x800x32,1280x720x32,1024x768x32,1024x768x24,800x600x32,auto
    multiboot /boot/amenos.bin bezaudio
    boot
}

menuentry "AmenOS - bez sterowników USB (klawiatura i mysz przez BIOS)" {
    set gfxpayload=1920x1080x32,1920x1080x24,1680x1050x32,1600x900x32,1440x900x32,1366x768x32,1280x1024x32,1280x800x32,1280x720x32,1024x768x32,1024x768x24,800x600x32,auto
    multiboot /boot/amenos.bin bezusb
    boot
}
